[package]
name = "symbolica"
version = "2.2.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
bincode = ["symbolica-upstream/bincode"]
faster_alloc = []
gmp = []
native_code_generation = []
no_gmp = ["symbolica-upstream/no_gmp"]
serde = ["symbolica-upstream/serde"]
tracing_max_level_info = ["symbolica-upstream/tracing_max_level_info"]
wasm = []

[dependencies]
symbolica-upstream = { package = "symbolica", git = "https://github.com/lcnbr/symbolica", rev = "d972f384ca87778fedd26d3ca2a752d75fffc38e", default-features = false, features = ["wasm"] }
