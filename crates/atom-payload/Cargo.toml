[package]
name = "symbolica-typst-atom-payload"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/symbolica-dev/symbolica-typst-plugin"

[features]
default = ["native"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr"]
wasm = ["symbolica/wasm"]

[dependencies]
blake3 = "1"
ciborium = "0.2.2"
# Let the embedding workspace select the same Atom ABI as its other bindings.
symbolica = { version = "3.0", default-features = false }
