[package]
name = "tymbolica-rubi-plugin"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "tymbolica_rubi_plugin"
crate-type = ["cdylib"]

[features]
default = []
compressed-step-metadata = ["symbolica-integrate/compressed-step-metadata"]
wizer-preinitialize = ["compressed-step-metadata"]

[dependencies]
ciborium = "0.2.2"
getrandom = "0.3"
symbolica = { version = "3.0.0", default-features = false, features = ["wasm"] }
symbolica-integrate = { path = "../../vendor/symbolica-integrate", default-features = false, features = ["steps"] }
tymbolica-atom-payload = { path = "../atom-payload", default-features = false, features = ["wasm"] }
wasm-minimal-protocol = "0.1"
