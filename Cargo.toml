[package]
name = "symbolica-typst-plugin"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/symbolica-dev/symbolica-typst-plugin"

[lib]
name = "symbolica_typst_plugin"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
ciborium = "0.2.2"
getrandom = "0.3"
symbolica = { version = "3.0.0", default-features = false, features = ["wasm"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
symbolica-typst-atom-payload = { path = "crates/atom-payload", default-features = false, features = ["wasm"] }
wasm-minimal-protocol = "0.1"

[workspace]
members = [
  "crates/atom-payload",
  "crates/inflate-plugin",
]
resolver = "3"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = true
