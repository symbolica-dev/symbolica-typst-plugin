[package]
name = "symbolica-typst-plugin"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/symbolica-dev/symbolica-typst-plugin"

[lib]
name = "symbolica_typst_plugin"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
ciborium = "0.2.2"
getrandom = "0.3"
symbolica = { workspace = true, features = ["wasm"] }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"] }
symbolica-typst-atom-payload = { path = "crates/atom-payload", default-features = false, features = ["wasm"] }
wasm-minimal-protocol = "0.1"

[workspace]
members = [
  "crates/atom-payload",
]
resolver = "3"

[workspace.dependencies]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", branch = "main", default-features = false }

# Ensure the integration crate uses the same Symbolica as the workspace.
# Cargo.lock pins the exact commit for reproducible builds.
[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica.git", branch = "main" }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep generated integration rule code compact while optimizing the shared
# algebra engine and Typst bridge for faster rule preparation.
[profile.release.package.symbolica-integrate]
opt-level = "z"
