[package]
name = "tymbolica-plugin"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "tymbolica_plugin"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }
ciborium = "0.2.2"
getrandom = "0.3"
symbolica = { version = "2.2", default-features = false, features = ["wasm"] }
tymbolica-atom-payload = { path = "crates/atom-payload", default-features = false, features = ["wasm"] }
wasm-minimal-protocol = "0.1"

[patch.crates-io]
# Temporary until astro-float publishes the merged wasm32 word-size fix.
astro-float = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
astro-float-num = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "ba3737137c2a2ccd7bb39f0441837d38ec867e78" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "ba3737137c2a2ccd7bb39f0441837d38ec867e78" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "ba3737137c2a2ccd7bb39f0441837d38ec867e78" }

[workspace]
members = [
  "crates/atom-payload",
  "crates/inflate-plugin",
  "crates/rubi-plugin",
  "vendor/symbolica-integrate",
]
resolver = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
