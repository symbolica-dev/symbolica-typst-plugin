[package]
name = "symbolica-typst-plugin"
version = "0.1.0"
authors = ["Lucien Huber <im@lcnbr.ch>", "Ben Ruijl"]
edition = "2024"
rust-version = "1.97"
publish = ["crates-io"]
description = "Symbolica for Typst, with reusable annotated expression interchange"
license = "MIT"
readme = "README-crate.md"
homepage = "https://symbolica.io"
documentation = "https://docs.rs/symbolica-typst-plugin"
repository = "https://github.com/symbolica-dev/symbolica-typst-plugin"
keywords = ["symbolica", "typst", "symbolic", "algebra", "wasm"]
categories = ["mathematics", "wasm", "encoding"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README-crate.md", "/LICENSE", "/LICENSE-SYMBOLICA.md", "/LICENSE-SYMBOLICA-TYPST.md"]

[lib]
name = "symbolica_typst_plugin"
# The same library also produces the plugin cdylib via scripts/build-engine.sh.
# Dependencies use only rlib so the final plugin supplies its runtime imports.
crate-type = ["rlib"]

[features]
default = ["native"]
native = ["symbolica/integer-gmp", "symbolica/float-mpfr"]
wasm = ["symbolica/wasm"]
# Only the final Symbolica plugin should enable its exports and runtime setup.
plugin = ["dep:ahash", "dep:getrandom", "dep:symbolica-integrate", "dep:wasm-minimal-protocol"]

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"], optional = true }
blake3 = "1"
ciborium = "0.2.2"
serde = { version = "1", features = ["derive"] }
getrandom = { version = "0.3", optional = true }
symbolica = { version = "3.0.1", default-features = false }
symbolica-integrate = { version = "2.0.1", default-features = false, features = ["compressed-step-metadata"], optional = true }
wasm-minimal-protocol = { version = "0.1", optional = true }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep generated integration rule code compact while optimizing the shared
# algebra engine and Typst bridge for faster rule preparation.
[profile.release.package.symbolica-integrate]
opt-level = "z"
