[package]
name = "symbolica-algebraic-sqrt2-mre"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# Standalone: no Tymbolica, Typst, Rubi, or Wasm runtime is needed.
[workspace]

[dependencies]
symbolica = { version = "3.0.0", default-features = false, features = ["wasm"] }

[patch.crates-io]
# Preserve Tymbolica's existing Astro-float dependency configuration.
astro-float = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
astro-float-num = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
