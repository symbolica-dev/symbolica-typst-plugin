[package]
name = "symbolica-algebraic-sqrt2-mre"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# Standalone: no Tymbolica, Typst, Rubi, or Wasm runtime is needed.
[workspace]

[dependencies]
symbolica = { version = "2.2", default-features = false, features = ["wasm"] }

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "4f1323185fe5e0c0f8c864ab89edd1905e7adef1" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "4f1323185fe5e0c0f8c864ab89edd1905e7adef1" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "4f1323185fe5e0c0f8c864ab89edd1905e7adef1" }
# Preserve Tymbolica's existing Astro-float dependency configuration.
astro-float = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
astro-float-num = { git = "https://github.com/stencillogic/astro-float", rev = "f92380e025deb8e1743ed93c6d5bf0783ac28717" }
